name = "ssh-relay"
main = "ssh_relay_worker.js"
compatibility_date = "2026-06-01"

# Deploy:
#   npx wrangler deploy
#
# This Worker has no bindings and no vars. The target host/port is pinned in
# CFG at the top of ssh_relay_worker.js; edit it and redeploy to change.
#
# After deploy, wrangler prints the URL, e.g.
#   https://ssh-relay.<you>.workers.dev
# That URL is the endpoint the sandbox ProxyCommand dials. Verify it from the
# sandbox with:
#   curl -s -o /dev/null -w "%{http_code}\n" "https://<worker>.workers.dev"
# (200 = the Worker is up; a non-WS GET returns the JSON health object.)
#
# The Worker is free on the Workers Free plan and the connect() it uses is
# included; it makes one outbound TCP connection per WebSocket session.
